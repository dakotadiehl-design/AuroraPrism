name: macOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  spm:
    name: SPM build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Build package
        run: swift build
      - name: Test package
        run: swift test

  xcode-app:
    name: Xcode app Debug + Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Aurora.app (Debug)
        run: |
          xcodebuild \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build
      - name: Build Aurora.app (Release)
        run: |
          xcodebuild \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build
