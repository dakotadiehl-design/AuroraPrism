<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Aurora Remote</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0d0f12; color: #f2f4f8; min-height: 100vh; }
    header { padding: 14px 18px; background: #161a20; border-bottom: 1px solid #2a3140; }
    h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
    .status { font-size: 0.82rem; color: #9aa4b2; margin-top: 4px; }
    main { padding: 16px; display: grid; gap: 14px; max-width: 480px; margin: 0 auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .go-wrap { display: grid; gap: 10px; }
    button {
      font-size: 1.15rem; padding: 16px 12px; border: 0; border-radius: 14px;
      background: #3a4454; color: white; font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); opacity: 0.92; }
    button.go {
      font-size: 2rem; padding: 36px 16px; background: #2b6cef;
      letter-spacing: 0.06em;
    }
    button.stop { background: #c0392b; }
    button.secondary { background: #2a3140; font-size: 1rem; }
    input {
      width: 100%; box-sizing: border-box; font-size: 1.15rem; padding: 14px;
      border-radius: 12px; border: 1px solid #3a4454; background: #12161c; color: #fff;
    }
    .card { background: #161a20; border-radius: 14px; padding: 14px; border: 1px solid #2a3140; }
    .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8699; margin-bottom: 4px; }
    .cue-name { font-size: 1.25rem; font-weight: 600; }
    .cue-meta { font-size: 0.85rem; color: #9aa4b2; margin-top: 2px; }
    .err { color: #ff8e8e; font-size: 0.9rem; margin-top: 8px; }
    .health { font-size: 0.8rem; color: #9aa4b2; }
  </style>
</head>
<body>
  <header>
    <h1>Aurora Live Ops</h1>
    <div class="status" id="status">Disconnected</div>
  </header>
  <main>
    <div class="card" id="auth">
      <label class="label" for="pin">Operator PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit PIN" />
      <div style="height:12px"></div>
      <button id="connectBtn" style="width:100%;background:#2b6cef">Connect</button>
      <p class="err" id="err"></p>
    </div>
    <div id="ops" hidden>
      <div class="card">
        <div class="label">Show / Song</div>
        <div id="showline" class="cue-name">—</div>
        <div class="status" id="songline"></div>
      </div>
      <div class="card">
        <div class="label">Current</div>
        <div id="currentCue" class="cue-name">—</div>
        <div id="currentMeta" class="cue-meta"></div>
      </div>
      <div class="card">
        <div class="label">Next</div>
        <div id="nextCue" class="cue-name">—</div>
        <div id="nextMeta" class="cue-meta"></div>
      </div>
      <div class="go-wrap">
        <button id="go" class="go">GO</button>
        <div class="row">
          <button id="back" class="secondary">Back</button>
          <button id="stop" class="stop">Stop</button>
        </div>
        <div class="row">
          <button id="songPrev" class="secondary">Song ◀</button>
          <button id="songNext" class="secondary">Song ▶</button>
        </div>
      </div>
      <div class="card">
        <div class="label">Master / Blackout</div>
        <div class="row" style="margin-bottom:10px">
          <button id="blackout" class="stop">Blackout</button>
          <button id="blackoutOff" class="secondary">BO Off</button>
        </div>
        <label class="label" for="master">Master <span id="masterPct">100%</span></label>
        <input id="master" type="range" min="0" max="100" value="100" style="width:100%;accent-color:#2b6cef" />
      </div>
      <div class="card health" id="healthline">—</div>
    </div>
  </main>
  <script>
    const PROTOCOL_VERSION = 1;
    let token = null;
    let pollTimer = null;
    const $ = (id) => document.getElementById(id);

    function uuid() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    class ApiError extends Error {
      constructor(message, status) {
        super(message);
        this.status = status;
      }
    }

    async function api(path, body) {
      let res;
      try {
        res = await fetch(path, {
          method: body ? 'POST' : 'GET',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'X-Aurora-Token': token } : {})
          },
          body: body ? JSON.stringify(body) : undefined
        });
      } catch (e) {
        throw new ApiError(e.message || 'network error', 0);
      }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new ApiError(json.error || res.statusText, res.status);
      return json;
    }

    function forceReauth(message) {
      token = null;
      if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
      $('ops').hidden = true;
      $('auth').hidden = false;
      $('status').textContent = 'Disconnected';
      $('err').textContent = message || 'Session expired — reconnect';
    }

    function isAuthFailure(err) {
      return err && (err.status === 401 || err.status === 403);
    }

    function isTransient(err) {
      // Network / 5xx only — never retry auth/validation errors (REM-06).
      if (!err) return false;
      if (err.status === 0) return true;
      if (err.status >= 500) return true;
      return false;
    }

    async function connect() {
      $('err').textContent = '';
      try {
        const r = await api('/api/hello', {
          clientId: 'web-' + Math.random().toString(36).slice(2, 10),
          pin: $('pin').value,
          displayName: 'iPad Web',
          protocolVersion: PROTOCOL_VERSION
        });
        if (r.protocolVersion != null && r.protocolVersion !== PROTOCOL_VERSION) {
          throw new ApiError('Protocol mismatch (server ' + r.protocolVersion + ', client ' + PROTOCOL_VERSION + ')', 400);
        }
        token = r.token;
        $('auth').hidden = true;
        $('ops').hidden = false;
        $('status').textContent = 'Connected · ' + r.role;
        poll();
      } catch (e) {
        $('err').textContent = e.message;
      }
    }

    // UI10-01 / REM-06: one requestId per press; retry only on transient transport failure.
    async function cmd(action) {
      const requestId = uuid();
      try {
        await api('/api/command', { requestId, action });
      } catch (e) {
        if (isAuthFailure(e)) {
          forceReauth(e.message);
          return;
        }
        if (isTransient(e)) {
          try {
            await api('/api/command', { requestId, action });
          } catch (e2) {
            if (isAuthFailure(e2)) forceReauth(e2.message);
            else $('status').textContent = e2.message;
          }
        } else {
          $('status').textContent = e.message;
        }
      }
    }

    function cueLabel(cue) {
      if (!cue) return '—';
      const num = cue.numberDisplay || '';
      const name = cue.name || '';
      if (num && name) return num + '  ' + name;
      return name || num || '—';
    }

    function cueMeta(cue) {
      if (!cue) return '';
      return cue.sectionLabel || '';
    }

    async function poll() {
      if (!token) return;
      try {
        const s = await api('/api/snapshot');
        if (s.protocolVersion != null && s.protocolVersion !== PROTOCOL_VERSION) {
          forceReauth('Protocol mismatch — reconnect');
          return;
        }
        $('showline').textContent = (s.showName || 'Aurora') + (s.locked ? ' · LOCKED' : '');
        $('songline').textContent = s.songTitle
          ? (s.songTitle + (s.songEntryIndex != null ? ' · entry ' + (s.songEntryIndex + 1) : ''))
          : '';
        $('currentCue').textContent = cueLabel(s.currentCue);
        $('currentMeta').textContent = cueMeta(s.currentCue);
        $('nextCue').textContent = cueLabel(s.nextCue);
        $('nextMeta').textContent = cueMeta(s.nextCue);
        const eng = s.engineRunning ? 'Engine on' : 'Engine off';
        const out = s.outputStatusLine || '';
        $('healthline').textContent = eng + (out ? ' · ' + out : '') + ' · ch ' + (s.activeChannelCount || 0)
          + (s.blackout ? ' · BLACKOUT' : '')
          + ' · Master ' + Math.round((s.masterIntensity != null ? s.masterIntensity : 1) * 100) + '%';
        $('status').textContent = eng + ' · ' + (s.role || 'operator');
        if (s.masterIntensity != null && document.activeElement !== $('master')) {
          $('master').value = Math.round(s.masterIntensity * 100);
          $('masterPct').textContent = Math.round(s.masterIntensity * 100) + '%';
        }
        if (s.blackout) {
          $('blackout').style.outline = '2px solid #ff8e8e';
        } else {
          $('blackout').style.outline = '';
        }
      } catch (e) {
        if (isAuthFailure(e)) {
          forceReauth(e.message || 'Session expired');
          return;
        }
        $('status').textContent = 'Snapshot error (retrying)…';
      }
      pollTimer = setTimeout(poll, 250);
    }

    $('connectBtn').onclick = connect;
    $('go').onclick = () => cmd({ name: 'go' });
    $('stop').onclick = () => cmd({ name: 'stop' });
    $('back').onclick = () => cmd({ name: 'back' });
    $('songPrev').onclick = () => cmd({ name: 'songPrevious' });
    $('songNext').onclick = () => cmd({ name: 'songNext' });
    $('blackout').onclick = () => cmd({ name: 'toggleBlackout' });
    $('blackoutOff').onclick = () => cmd({ name: 'blackoutOff' });
    $('master').oninput = () => {
      const v = Number($('master').value) / 100;
      $('masterPct').textContent = Math.round(v * 100) + '%';
    };
    $('master').onchange = () => {
      const v = Number($('master').value) / 100;
      cmd({ name: 'masterIntensity', doubleValue: v });
    };
  </script>
</body>
</html>
